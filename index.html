<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Budget Planner — Track, Plan, Grow</title>
<meta name="theme-color" content="#0E2B22">
<link rel="icon" type="image/svg+xml" href="./icons/icon.svg">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..700&family=Space+Grotesk:wght@300..700&family=Spline+Sans+Mono:wght@400..700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./styles.css">
</head>
<body>

<!-- Hidden until login succeeds -->
<div id="main-app" style="display:none">
  <div class="app">
    <aside>
      <div class="brand">
        <div class="mark"><svg viewBox="0 0 24 24" fill="none" stroke="#F4F9F1" stroke-width="2" stroke-linecap="round"><path d="M4 20C4 11.2 11.2 4 20 4c0 8.8-7.2 16-16 16z"/><path d="M4 20C9 15 13 10.5 20 4"/></svg></div>
        <div><b>Budget Planner</b><small>track · plan · grow</small></div>
      </div>
      <nav id="mainNav">
        <button class="nav-btn active" data-view="overview"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="3" width="7.5" height="9" rx="2"/><rect x="13.5" y="3" width="7.5" height="5.5" rx="2"/><rect x="13.5" y="12" width="7.5" height="9" rx="2"/><rect x="3" y="15.5" width="7.5" height="5.5" rx="2"/></svg>Overview</button>
        <button class="nav-btn" data-view="transactions"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4v13m0 0-3.5-3.5M7 17l3.5-3.5"/><path d="M17 20V7m0 0 3.5 3.5M17 7l-3.5 3.5"/></svg>Transactions <span class="badge" id="txBadge">0</span></button>
        <button class="nav-btn" data-view="budgets"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4.5"/><circle cx="12" cy="12" r=".5" fill="currentColor"/></svg>Budgets</button>
        <button class="nav-btn" data-view="reports"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 20v-8M11 20V4M17 20v-5"/><path d="M3 20h18"/></svg>Reports</button>
        <button class="nav-btn" data-view="trends"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l6-6 4 4 8-8"/><path d="M21 7h-6m6 0v6"/></svg>Trends</button>
      </nav>
      <div class="side-foot">
        <div class="side-stat"><span>All-time net</span><b id="sideNet">$0</b></div>
        <button class="install-btn" id="installBtn" hidden>⤓ Install app</button>
        <button class="reset-btn" id="resetBtn">↻ Reset data</button>
      </div>
    </aside>

    <main>
      <header class="topbar">
        <div class="mnav">
          <button class="chev" id="prevM"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M15 18l-6-6 6-6"/></svg></button>
          <span id="monthLabel">—</span>
          <button class="chev" id="nextM"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M9 6l6 6-6 6"/></svg></button>
        </div>
        <button class="today-btn" id="todayBtn">Today</button>
        <div class="top-right">
          <div class="net-chip" id="netChip"><i></i><span id="netChipVal">$0</span></div>
          <button class="btn-add" id="addBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg><span>New transaction</span></button>
        </div>
      </header>

      <section class="view active" id="view-overview"><div id="ovGrid" class="grid"></div></section>
      <section class="view" id="view-transactions">
        <div class="card reveal" style="margin-bottom:18px">
          <div class="card-head"><div><h3>Transactions</h3><div class="sub" id="txMonthSub"></div></div></div>
          <div class="toolbar">
            <div class="seg" id="txSeg"><button class="active" data-seg="all">All</button><button data-seg="in">Inflow</button><button data-seg="out">Outflow</button></div>
            <div class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.8-3.8"/></svg><input id="txSearch" type="text" placeholder="Search notes or categories…"></div>
            <span class="tx-summary" id="txSummary"></span>
          </div>
          <div id="txList"></div>
        </div>
      </section>
      <section class="view" id="view-budgets"><div id="budgetWrap" class="grid"></div></section>
      <section class="view" id="view-reports"><div id="repWrap" class="grid"></div></section>
      <section class="view" id="view-trends"><div id="trendWrap" class="grid"></div></section>
      <footer class="foot">🌿 Budget Planner keeps everything secure via Supabase.</footer>
    </main>
  </div>

  <button class="fab" id="fab"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>

  <div class="modal" id="txModal" role="dialog" aria-modal="true">
    <div class="modal-bg" id="modalBg"></div>
    <div class="sheet">
      <header><h2>New entry</h2><button class="x-btn" id="modalX"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button></header>
      <div class="type-toggle" id="typeToggle"><div class="thumb"></div><button id="btnOut" class="on">− Outflow</button><button id="btnIn">+ Inflow</button></div>
      <div class="field"><label>Amount</label><div class="amount-box" id="amtBox"><span class="cur">HK$</span><input id="amtInput" inputmode="decimal" placeholder="0.00" autocomplete="off"></div></div>
      <div class="field"><label>Category</label><div class="cat-grid" id="catGrid"></div></div>
      <div class="field two-col">
        <div><label>Date</label><input type="date" id="dateInput"></div>
        <div><label>Note</label><input type="text" id="noteInput" placeholder="e.g. Groceries" maxlength="60"></div>
      </div>
      <button class="submit-btn" id="submitTx">Add outflow</button>
    </div>
  </div>
  <div class="toasts" id="toasts"></div>
  <svg width="0" height="0" style="position:absolute"><defs><linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2FBF71"/><stop offset="1" stop-color="#A7E26F"/></linearGradient></defs></svg>
</div>

<script type="module" src="./js/app.js"></script>
</body>
</html>
